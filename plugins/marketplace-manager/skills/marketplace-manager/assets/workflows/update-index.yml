name: Verify Registry Index

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - '.claude-plugin/marketplace.json'
      - '.agents/plugins/marketplace.json'
      - 'registry/**'
      - 'scripts/catalog.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify committed catalogs without rewriting or pushing
        run: python3 scripts/catalog.py --check
