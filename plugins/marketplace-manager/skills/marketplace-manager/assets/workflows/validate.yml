name: Validate Plugins

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'archive/**'
      - 'tools/**'
      - 'templates/**'
      - '.agents/plugins/marketplace.json'
      - '.claude-plugin/marketplace.json'
      - 'registry/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'archive/**'
      - 'tools/**'
      - 'templates/**'
      - '.agents/plugins/marketplace.json'
      - '.claude-plugin/marketplace.json'
      - 'registry/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  validate:
    name: Validate Plugin Manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Run combined plugin checks
        run: ./scripts/check-all.sh

      - name: Check registry drift
        run: ./scripts/check-registry-drift.sh
